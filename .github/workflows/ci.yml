name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crystal-lang/install-crystal@v1
      - run: shards install
      - run: mkdir -p bin && crystal build -o bin/ameba lib/ameba/bin/ameba.cr
      - run: crystal tool format --check
      - run: bin/ameba
      - run: crystal spec
      - run: crystal spec -Dpreview_mt
