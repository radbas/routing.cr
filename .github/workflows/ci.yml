name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest supported release and latest
        crystal: [1.19.0, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - run: shards install
      - run: mkdir -p bin && crystal build -o bin/ameba lib/ameba/bin/ameba.cr
      - run: crystal tool format --check
      - run: bin/ameba
      - run: crystal spec
      - run: crystal spec -Dpreview_mt
      - run: crystal docs
